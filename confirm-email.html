<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Confirm your email | Wine Bank on View</title>
  <link rel="stylesheet" href="./css/global.css" />
  <link rel="stylesheet" href="./css/auth.css" />
</head>
<body>
<header class="site-header">
  <a class="site-logo" href="./index.html">WINEBANK</a>
  <a class="secondary-button" href="./login.html">Back to login</a>
</header>

<main class="auth-page">
  <section class="auth-visual">
    <div class="auth-visual-content">
      <p class="auth-eyebrow">Account security</p>
      <h1>One last step.</h1>
    </div>
  </section>
  <section class="auth-panel">
    <div class="auth-form-wrap">
      <h2 class="auth-heading">Confirm your email</h2>
      <p class="auth-intro">Click the button below to finish confirming your address. We ask for a click here, rather than confirming automatically, so that email security scanners can't use up your link before you do.</p>
      <button class="primary-button auth-submit" type="button" id="confirmButton">Confirm my email</button>
      <div class="status" id="confirmStatus" aria-live="polite"></div>
    </div>
  </section>
</main>

<script type="module" src="./JS/confirm-email.js"></script>
</body>
</html>
