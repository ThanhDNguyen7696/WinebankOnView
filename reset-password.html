<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset password | Wine Bank on View</title>
  <link rel="stylesheet" href="./css/global.css" />
  <link rel="stylesheet" href="./css/auth.css" />
</head>
<body>
<header class="site-header">
  <a class="site-logo" href="./index.html">WINEBANK</a>
  <a class="secondary-button" href="./login.html">Back to login</a>
</header>

<main class="auth-page">
  <section class="auth-visual">
    <div class="auth-visual-content">
      <p class="auth-eyebrow">Account security</p>
      <h1>Choose a new password.</h1>
    </div>
  </section>
  <section class="auth-panel">
    <div class="auth-form-wrap">
      <h2 class="auth-heading">Reset password</h2>
      <div id="requestResetPanel">
        <p class="auth-intro">Enter your account email and we will send you a secure password reset link.</p>
        <form id="requestResetForm" novalidate>
          <div class="field">
            <label for="resetEmail">Email address</label>
            <input id="resetEmail" type="email" autocomplete="email" />
            <div class="error" id="resetEmailError"></div>
          </div>
          <button class="primary-button auth-submit" type="submit">Send reset link</button>
          <div class="status" id="requestResetStatus" aria-live="polite"></div>
        </form>
      </div>
      <form id="resetPasswordForm" novalidate hidden>
        <p class="auth-intro">Use at least eight characters, including a capital letter and a number.</p>
        <div class="field">
          <label for="newPassword">New password</label>
          <input id="newPassword" type="password" autocomplete="new-password" />
          <button class="password-toggle" type="button" data-password-toggle="newPassword">Show</button>
          <div class="error" id="newPasswordError"></div>
        </div>
        <div class="field">
          <label for="confirmNewPassword">Confirm new password</label>
          <input id="confirmNewPassword" type="password" autocomplete="new-password" />
          <button class="password-toggle" type="button" data-password-toggle="confirmNewPassword">Show</button>
          <div class="error" id="confirmNewPasswordError"></div>
        </div>
        <button class="primary-button auth-submit" type="submit">Save new password</button>
        <div class="status" id="resetPasswordStatus" aria-live="polite"></div>
      </form>
    </div>
  </section>
</main>

<script type="module" src="./JS/reset-password.js"></script>
</body>
</html>
